<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معهد المدينة العالي للهندسة والتكنولوجيا - منظومة إدارة التدريب والبحث العلمي</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: { 800: '#1e3a8a', 900: '#0f172a' },
                        gold: { 500: '#d97706', 600: '#b45309', 400: '#f59e0b' }
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts: Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f8fafc; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        @media print {
            body * { visibility: hidden; }
            #letter-preview-container, #letter-preview-container * { visibility: visible; }
            #letter-preview-container {
                position: absolute; left: 0; top: 0; width: 100% !important; margin: 0 !important; padding: 15px !important;
                box-shadow: none !important; border: 4px solid #0f172a !important; page-break-inside: avoid;
            }
            @page { size: A4 portrait; margin: 5mm; }
            .print\:hidden { display: none !important; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Header / Navbar -->
    <header class="bg-navy-900 text-white shadow-lg border-b-4 border-gold-500 sticky top-0 z-50">
        <div class="container mx-auto px-4 py-3 flex flex-wrap justify-between items-center">
            <div class="flex items-center space-x-3 space-x-reverse">
                <!-- Dynamic Institute Logo -->
                <div id="logo-preview-container" class="w-12 h-12 bg-white rounded-xl p-1 flex items-center justify-center shadow-md overflow-hidden border-2 border-gold-400">
                    <img id="institute-logo-img" src="https://placehold.co/70x70/1e3a8a/fbbf24?text=LOGO" alt="شعار معهد المدينة" class="w-full h-full object-contain">
                </div>
                <div class="mr-2">
                    <h1 class="text-sm md:text-base font-bold tracking-normal leading-snug">معهد المدينة العالي للهندسة والتكنولوجيا</h1>
                    <p class="text-xs text-gold-400 font-bold tracking-wider mt-1">منظومة إدارة التدريب والبحث العلمي بالمعهد</p>
                </div>
            </div>
            <!-- Navigation Tabs -->
            <nav class="flex space-x-1 sm:space-x-2 space-x-reverse mt-3 md:mt-0 items-center overflow-x-auto pb-1 md:pb-0">
                <button onclick="switchTab('home')" id="btn-home" class="tab-btn px-4 py-2 rounded-lg text-sm font-semibold transition bg-gold-500 text-navy-900 shadow whitespace-nowrap">
                    <i class="fa-solid fa-house ml-1"></i> الرئيسية
                </button>
                <button onclick="switchTab('announcements')" id="btn-announcements" class="tab-btn px-4 py-2 rounded-lg text-sm font-semibold transition hover:bg-slate-800 text-slate-200 whitespace-nowrap">
                    <i class="fa-solid fa-bullhorn ml-1"></i> الإعلانات
                </button>
                <button onclick="switchTab('companies')" id="btn-companies" class="tab-btn px-4 py-2 rounded-lg text-sm font-semibold transition hover:bg-slate-800 text-slate-200 whitespace-nowrap">
                    <i class="fa-solid fa-building ml-1"></i> الشركات المتاحة
                </button>
                <button onclick="switchTab('student')" id="btn-student" class="tab-btn px-4 py-2 rounded-lg text-sm font-semibold transition hover:bg-slate-800 text-slate-200 whitespace-nowrap">
                    <i class="fa-solid fa-id-card ml-1"></i> استعلام الطالب
                </button>
                <button onclick="switchTab('letters')" id="btn-letters" class="tab-btn px-4 py-2 rounded-lg text-sm font-semibold transition hover:bg-slate-800 text-gold-400 border border-gold-500/30 whitespace-nowrap">
                    <i class="fa-solid fa-file-contract ml-1"></i> الخطابات الرسمية
                </button>
                <button onclick="openAdminLoginModal()" id="btn-admin-gate" class="bg-gold-500 hover:bg-gold-600 text-navy-900 font-bold px-3 py-2 rounded-lg text-xs transition mr-2 shadow flex items-center gap-1.5 shrink-0">
                    <i class="fa-solid fa-user-lock"></i>
                    <span class="hidden sm:inline">دخول المسؤولين</span>
                </button>
                <button onclick="switchTab('admin')" id="btn-admin" class="tab-btn hidden px-4 py-2 rounded-lg text-sm font-semibold transition border border-gold-500 text-gold-400 bg-slate-900 whitespace-nowrap">
                    <i class="fa-solid fa-user-shield ml-1"></i> لوحة التحكم
                </button>
            </nav>
        </div>
    </header>

    <!-- Student Application Modal -->
    <div id="apply-modal" class="fixed inset-0 bg-black/70 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-xl w-full p-6 md:p-8 shadow-2xl fade-in border-t-4 border-gold-500 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-start mb-6 pb-3 border-b">
                <div>
                    <h3 class="text-lg font-bold text-navy-900 flex items-center gap-2">
                        <i class="fa-solid fa-file-signature text-gold-500"></i> تقديم طلب تدريب في:
                    </h3>
                    <div id="modal-company-title" class="text-gold-600 font-extrabold text-xl mt-1 leading-snug"></div>
                </div>
                <button onclick="closeApplyModal()" class="text-slate-400 hover:text-slate-600 p-1">
                    <i class="fa-solid fa-xmark text-2xl"></i>
                </button>
            </div>
            <form onsubmit="submitStudentApplication(event)" class="space-y-4">
                <input type="hidden" id="apply-company-name">
                <input type="hidden" id="apply-company-dept">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">اسم الطالب الرباعي</label>
                    <input type="text" id="apply-student-name" required class="w-full px-4 py-2.5 border border-slate-300 rounded-xl text-sm" placeholder="الاسم ثلاثي أو رباعي">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">الكود الجامعي (رقم الهوية)</label>
                        <input type="text" id="apply-student-id" required class="w-full px-4 py-2.5 border border-slate-300 rounded-xl text-sm" placeholder="مثال: 20230155">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">الرقم القومي (14 رقم)</label>
                        <input type="text" id="apply-student-nat-id" required maxlength="14" class="w-full px-4 py-2.5 border border-slate-300 rounded-xl text-sm" placeholder="الرقم القومي">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">القسم الهندسي</label>
                        <select id="apply-student-dept" required class="w-full px-3 py-2.5 border border-slate-300 rounded-xl text-xs bg-white">
                            <option value="عام (جميع الأقسام)">عام (جميع الأقسام)</option>
                            <option value="هندسة الإلكترونيات والإتصالات الكهربية">هندسة الإلكترونيات والإتصالات</option>
                            <option value="الهندسة المدنية">الهندسة المدنية</option>
                            <option value="هندسة الحاسبات والتحكم">هندسة الحاسبات والتحكم</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">الفرقة الدراسية الحالية</label>
                        <select id="apply-student-year" required class="w-full px-3 py-2.5 border border-slate-300 rounded-xl text-xs bg-white">
                            <option value="الفرقة الإعدادية">الفرقة الإعدادية</option>
                            <option value="الفرقة الأولى">الفرقة الأولى</option>
                            <option value="الفرقة الثانية">الفرقة الثانية</option>
                            <option value="الفرقة الثالثة">الفرقة الثالثة</option>
                            <option value="الفرقة الرابعة">الفرقة الرابعة</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">اسم المجال / موضوع التدريب المراد التدرب فيه</label>
                    <input type="text" id="apply-student-topic" required class="w-full px-4 py-2.5 border border-slate-300 rounded-xl text-sm" placeholder="مثال: شبكات حاسب، تصميم إنشائي، صيانة سنترالات...">
                </div>
                <div class="pt-3">
                    <button type="submit" class="w-full bg-navy-900 hover:bg-navy-800 text-white font-bold py-3.5 rounded-xl transition shadow flex items-center justify-center gap-2">
                        <i class="fa-solid fa-paper-plane"></i> إرسال الطلب للجنة التدريب بالمعهد
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Admin Login Modal -->
    <div id="admin-login-modal" class="fixed inset-0 bg-black/70 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl fade-in border-t-4 border-gold-500">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl font-bold text-navy-900 flex items-center gap-2">
                    <i class="fa-solid fa-lock text-gold-500"></i> تسجيل دخول المسؤولين
                </h3>
                <button onclick="closeAdminLoginModal()" class="text-slate-400 hover:text-slate-600">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            <p class="text-sm text-slate-600 mb-4">أدخل الرقم السري الخاص بإدارة لجنة التدريب لمعهد المدينة:</p>
            <form onsubmit="handleAdminLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">الرقم السري</label>
                    <div class="relative">
                        <input type="password" id="admin-password-input" required class="w-full px-4 py-3 pl-12 border border-slate-300 rounded-xl focus:ring-2 focus:ring-navy-800 focus:outline-none text-center tracking-widest text-lg font-bold" placeholder="••••">
                        <button type="button" onclick="togglePasswordVisibility('admin-password-input', 'toggle-icon-1')" class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-navy-900 focus:outline-none p-1">
                            <i id="toggle-icon-1" class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>
                <div id="admin-login-error" class="text-red-500 text-xs hidden text-center font-semibold"></div>
                <div class="flex gap-2 pt-2">
                    <button type="submit" class="flex-1 bg-navy-900 hover:bg-navy-800 text-white font-bold py-3 rounded-xl transition shadow">
                        دخول لوحة التحكم
                    </button>
                    <button type="button" onclick="closeAdminLoginModal()" class="px-4 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-3 rounded-xl transition">
                        إلغاء
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Edit Announcement Modal -->
    <div id="edit-ann-modal" class="fixed inset-0 bg-black/70 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl fade-in border-t-4 border-gold-500">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl font-bold text-navy-900 flex items-center gap-2">
                    <i class="fa-solid fa-pen-to-square text-gold-500"></i> تعديل الإعلان المنشور
                </h3>
                <button onclick="closeEditAnnModal()" class="text-slate-400 hover:text-slate-600">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            <form onsubmit="handleSaveEditAnnouncement(event)" class="space-y-4">
                <input type="hidden" id="edit-ann-id">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">عنوان الإعلان</label>
                    <input type="text" id="edit-ann-title" required class="w-full px-4 py-2.5 border border-slate-300 rounded-xl text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">محتوى الإعلان</label>
                    <textarea id="edit-ann-desc" required rows="4" class="w-full px-4 py-2.5 border border-slate-300 rounded-xl text-sm"></textarea>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">تغيير الصورة/الملف المرفق (اختياري)</label>
                    <input type="file" id="edit-ann-file" accept="image/*,.pdf" class="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-slate-100 file:text-navy-900 hover:file:bg-slate-200">
                </div>
                <div class="flex gap-2 pt-2">
                    <button type="submit" class="flex-1 bg-navy-900 hover:bg-navy-800 text-white font-bold py-3 rounded-xl transition shadow">
                        حفظ التعديلات
                    </button>
                    <button type="button" onclick="closeEditAnnModal()" class="px-4 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-3 rounded-xl transition">
                        إلغاء
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Edit Company Modal -->
    <div id="edit-comp-modal" class="fixed inset-0 bg-black/70 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl fade-in border-t-4 border-gold-500">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl font-bold text-navy-900 flex items-center gap-2">
                    <i class="fa-solid fa-building-pen text-gold-500"></i> تعديل بيانات الشركة
                </h3>
                <button onclick="closeEditCompModal()" class="text-slate-400 hover:text-slate-600">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            <form onsubmit="handleSaveEditCompany(event)" class="space-y-4">
                <input type="hidden" id="edit-comp-id">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">اسم الشركة</label>
                    <input type="text" id="edit-comp-name" required class="w-full px-4 py-2.5 border border-slate-300 rounded-xl text-sm">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">القسم الهندسي المخصص</label>
                        <select id="edit-comp-dept" required class="w-full px-4 py-2.5 border border-slate-300 rounded-xl text-xs bg-white">
                            <option value="عام (جميع الأقسام)">عام (جميع الأقسام)</option>
                            <option value="هندسة الإلكترونيات والإتصالات الكهربية">هندسة الإلكترونيات والإتصالات</option>
                            <option value="الهندسة المدنية">الهندسة المدنية</option>
                            <option value="هندسة الحاسبات والتحكم">هندسة الحاسبات والتحكم</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">المقاعد المتاحة</label>
                        <input type="number" id="edit-comp-seats" required class="w-full px-4 py-2.5 border border-slate-300 rounded-xl text-sm">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">مزايا أو متطلبات التدريب</label>
                    <input type="text" id="edit-comp-perks" required class="w-full px-4 py-2.5 border border-slate-300 rounded-xl text-sm">
                </div>
                <div class="flex gap-2 pt-2">
                    <button type="submit" class="flex-1 bg-navy-900 hover:bg-navy-800 text-white font-bold py-3 rounded-xl transition shadow">
                        حفظ التعديلات
                    </button>
                    <button type="button" onclick="closeEditCompModal()" class="px-4 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-3 rounded-xl transition">
                        إلغاء
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Message Modal -->
    <div id="msg-modal" class="fixed inset-0 bg-black/70 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-sm w-full p-6 text-center shadow-2xl fade-in border-t-4 border-gold-500">
            <div id="msg-icon" class="w-14 h-14 bg-navy-900 text-gold-400 rounded-full flex items-center justify-center text-2xl mx-auto mb-3 shadow">
                <i class="fa-solid fa-circle-check"></i>
            </div>
            <h3 id="msg-title" class="text-xl font-bold text-navy-900 mb-2"></h3>
            <p id="msg-text" class="text-slate-600 text-sm mb-6 leading-relaxed"></p>
            <button onclick="closeMsgModal()" class="w-full bg-navy-900 hover:bg-navy-800 text-white font-bold py-3 rounded-xl transition shadow">
                حسناً
            </button>
        </div>
    </div>

</body>
</html>
